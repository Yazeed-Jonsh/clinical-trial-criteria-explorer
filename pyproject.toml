[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-trial-criteria-explorer"
version = "0.1.0"
description = "Evidence-preserving clinical trial criteria exploration"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
trial-explorer = "trial_explorer.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]
vector = ["numpy==2.3.5", "onnxruntime==1.32.0", "tokenizers==0.23.3", "faiss-cpu==1.16.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
